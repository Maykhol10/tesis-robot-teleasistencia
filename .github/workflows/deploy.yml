name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya esté corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Construir sitio estático
        env:
          GITHUB_PAGES: "true"
          # URL pública del robot. Se define como variable del repositorio
          # (Settings > Secrets and variables > Actions > Variables) porque
          # el túnel de pruebas cambia de dirección en cada arranque.
          # Sin ella, la web se despliega en modo demostración.
          NEXT_PUBLIC_ROBOT_URL: ${{ vars.NEXT_PUBLIC_ROBOT_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
